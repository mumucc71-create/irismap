<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IRIS MAPPING LAB | 승인 필요</title>
  <style>
    :root{color-scheme:dark;--bg:#05090f;--panel:#0b1420;--line:#24475b;--text:#f5f7fa;--muted:#9db0bd;--accent:#36d8d0;--gold:#f3c85a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#12313a 0%,var(--bg) 46%,#020509 100%);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}
    main{width:min(560px,calc(100% - 32px));padding:34px;border:1px solid var(--line);border-radius:10px;background:rgba(11,20,32,.94);box-shadow:0 24px 80px rgba(0,0,0,.38);text-align:center}
    .brand{margin:0 0 10px;color:var(--accent);font-size:14px;font-weight:900;letter-spacing:.08em}
    h1{margin:0 0 16px;font-size:28px;line-height:1.28}
    p{margin:0;color:var(--muted);font-size:16px;line-height:1.65}
    .notice{margin-top:18px;padding:14px;border:1px solid rgba(243,200,90,.55);border-radius:8px;color:#fff2bd;background:rgba(243,200,90,.08)}
  </style>
</head>
<body>
  <main>
    <p class="brand">IRIS MAPPING LAB</p>
    <h1>관리자 승인 후 이용 가능합니다.</h1>
    <p>이전 주소의 사용은 중단되었습니다. 계속 이용하려면 관리자에게 새 접속 주소와 사용 승인을 요청해 주세요.</p>
    <p class="notice">승인되지 않은 사용자는 이 주소에서 서비스를 이용할 수 없습니다.</p>
  </main>
</body>
</html>
